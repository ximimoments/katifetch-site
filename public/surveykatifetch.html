<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katifetch Survey</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-slate-100 font-sans min-h-screen p-4 md:p-8 flex justify-center items-center">

  <div class="max-w-2xl w-full bg-slate-900/60 border border-white/10 rounded-2xl p-6 md:p-8 shadow-2xl backdrop-blur-md">
    
    <!-- Header -->
    <div class="mb-6 border-b border-white/10 pb-4 flex justify-between items-end">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white flex items-center gap-2">
          <span class="text-[#00ff41]">#</span> Katifetch Survey
        </h1>
        <p class="text-xs md:text-sm text-slate-400 font-mono mt-1">
          Help us improve by sharing your user experience.
        </p>
      </div>
      <!-- Step Indicator -->
      <span id="stepIndicator" class="text-xs font-mono text-[#00ff41] bg-white/5 px-3 py-1 rounded-full border border-white/10">
        Step 1 / 4
      </span>
    </div>

    <form id="surveyForm" onsubmit="event.preventDefault();">

      <!-- STEP 1: MULTIPLE CHOICE (Checkboxes) -->
      <div id="step1" class="step-content space-y-6">
        <h2 class="text-sm font-mono text-[#00ff41] uppercase tracking-wider">
          1. Multiple Choice Questions
        </h2>

        <!-- Question 1.1 -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-200">
            Which operating systems or environments do you use or plan to use Katifetch on?
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-mono text-slate-300">
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="linux" class="accent-[#00ff41]">
              <span>Linux (Debian, Arch, Ubuntu, Fedora, etc.)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="android" class="accent-[#00ff41]">
              <span>Android (Termux / Root / Custom ROMs)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="windows" class="accent-[#00ff41]">
              <span>Windows (PowerShell / WSL / Git Bash)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="macos" class="accent-[#00ff41]">
              <span>macOS</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="bsd" class="accent-[#00ff41]">
              <span>BSD (FreeBSD, OpenBSD, NetBSD)</span>
            </label>

            <!-- Other option with dynamic input -->
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" id="checkOtherOS" value="other" class="accent-[#00ff41]" onchange="toggleOtherInput('checkOtherOS', 'otherOSContainer')">
              <span>Other OS / Environment...</span>
            </label>
          </div>

          <div id="otherOSContainer" class="hidden mt-2">
            <input 
              type="text" 
              placeholder="Specify other OS/environment (e.g., Haiku OS, BeOS)..." 
              class="w-full px-3 py-2 rounded-xl bg-black border border-white/20 text-xs text-slate-200 focus:outline-none focus:border-[#00ff41] font-mono"
            />
          </div>
        </div>

        <!-- Question 1.2 -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-200">
            Which command shells or terminal environments do you primarily use?
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-mono text-slate-300">
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="bash" class="accent-[#00ff41]">
              <span>Bash</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="zsh" class="accent-[#00ff41]">
              <span>Zsh</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="fish" class="accent-[#00ff41]">
              <span>Fish shell</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" value="powershell" class="accent-[#00ff41]">
              <span>PowerShell</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="checkbox" id="checkOtherShell" value="other" class="accent-[#00ff41]" onchange="toggleOtherInput('checkOtherShell', 'otherShellContainer')">
              <span>Other Shell...</span>
            </label>
          </div>

          <div id="otherShellContainer" class="hidden mt-2">
            <input 
              type="text" 
              placeholder="Specify shell (e.g., Nushell, Dash, Tcsh)..." 
              class="w-full px-3 py-2 rounded-xl bg-black border border-white/20 text-xs text-slate-200 focus:outline-none focus:border-[#00ff41] font-mono"
            />
          </div>
        </div>
      </div>

      <!-- STEP 2: SINGLE CHOICE (Radio buttons) -->
      <div id="step2" class="step-content hidden space-y-6">
        <h2 class="text-sm font-mono text-[#00ff41] uppercase tracking-wider">
          2. Single Choice Questions
        </h2>

        <!-- Question 2.1 -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-200">
            How often do you run Katifetch?
          </label>
          <div class="space-y-2 text-xs font-mono text-slate-300">
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="frequency" value="daily" class="accent-[#00ff41]">
              <span>Daily (automatically on terminal startup)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="frequency" value="weekly" class="accent-[#00ff41]">
              <span>Occasionally (a few times a week)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="frequency" value="screenshots" class="accent-[#00ff41]">
              <span>Only when taking screenshots (rice / dotfiles)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="frequency" value="testing" class="accent-[#00ff41]">
              <span>Just testing or checking system info once in a while</span>
            </label>
          </div>
        </div>

        <!-- Question 2.2 -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-200">
            How would you rate the execution speed on your system?
          </label>
          <div class="space-y-2 text-xs font-mono text-slate-300">
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="performance" value="instant" class="accent-[#00ff41]">
              <span>Ultra Fast (Instant output)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="performance" value="acceptable" class="accent-[#00ff41]">
              <span>Acceptable (Slight delay, but fine)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="performance" value="slow" class="accent-[#00ff41]">
              <span>Slow (Noticeable lag when detecting specs)</span>
            </label>
          </div>
        </div>

        <!-- Question 2.3 -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-200">
            How did you install Katifetch on your machine?
          </label>
          <div class="space-y-2 text-xs font-mono text-slate-300">
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="install_method" value="repo" class="accent-[#00ff41]">
              <span>From official system repositories / package manager</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="install_method" value="sh_script" class="accent-[#00ff41]">
              <span>Using the shell installer script (.sh)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="install_method" value="git_cloned" class="accent-[#00ff41]">
              <span>Cloning the source repository and running manually</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 cursor-pointer">
              <input type="radio" name="install_method" value="manual_bin" class="accent-[#00ff41]">
              <span>Manual copy of binary / script into system PATH</span>
            </label>
          </div>
        </div>
      </div>

      <!-- STEP 3: FEEDBACK -->
      <div id="step3" class="step-content hidden space-y-4">
        <h2 class="text-sm font-mono text-[#00ff41] uppercase tracking-wider">
          3. Feedback & Suggestions
        </h2>

        <div class="space-y-2">
          <label class="block text-sm font-medium text-slate-200">
            What features, missing ASCII logos, or enhancements would you like to see next?
          </label>
          <textarea 
            rows="5" 
            placeholder="Type your feedback here..."
            class="w-full px-3 py-2 rounded-xl bg-black border border-white/20 text-xs text-slate-200 focus:outline-none focus:border-[#00ff41] font-mono resize-none"
          ></textarea>
        </div>
      </div>

      <!-- STEP 4: CONTACT INFO (Email al final) -->
      <div id="step4" class="step-content hidden space-y-4">
        <h2 class="text-sm font-mono text-[#00ff41] uppercase tracking-wider">
          4. Contact Information
        </h2>

        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-slate-200">
            Email Address <span class="text-slate-500 text-xs font-mono">(Optional - if you would like us to contact you back)</span>
          </label>
          <input 
            type="email" 
            id="email"
            name="email"
            placeholder="user@example.com" 
            class="w-full px-3 py-2.5 rounded-xl bg-black border border-white/20 text-xs text-slate-200 focus:outline-none focus:border-[#00ff41] font-mono transition-colors"
          />
        </div>
      </div>

      <!-- BUTTONS NAVIGATION -->
      <div class="mt-8 pt-4 border-t border-white/10 flex gap-3">
        <button 
          type="button" 
          id="prevBtn"
          onclick="changeStep(-1)"
          class="hidden w-1/3 py-3 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 font-bold text-xs font-mono transition-all"
        >
          [ Back ]
        </button>

        <button 
          type="button" 
          id="nextBtn"
          onclick="changeStep(1)"
          class="w-full py-3 px-6 rounded-xl bg-green-600 hover:bg-green-500 text-white font-bold text-xs transition-all shadow-[0_0_15px_rgba(0,255,65,0.2)] font-mono ml-auto"
        >
          Next &rarr;
        </button>

        <button 
          type="submit" 
          id="submitBtn"
          class="hidden w-full py-3 px-6 rounded-xl bg-green-600 hover:bg-green-500 text-white font-bold text-xs transition-all shadow-[0_0_15px_rgba(0,255,65,0.2)] font-mono"
        >
          [ Submit Response ]
        </button>
      </div>

    </form>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 4;

    function changeStep(delta) {
      document.getElementById(`step${currentStep}`).classList.add('hidden');
      currentStep += delta;
      document.getElementById(`step${currentStep}`).classList.remove('hidden');

      document.getElementById('stepIndicator').innerText = `Step ${currentStep} / ${totalSteps}`;

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const submitBtn = document.getElementById('submitBtn');

      if (currentStep === 1) {
        prevBtn.classList.add('hidden');
        nextBtn.classList.remove('hidden');
        nextBtn.classList.add('w-full');
        submitBtn.classList.add('hidden');
      } else if (currentStep === totalSteps) {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.add('hidden');
        submitBtn.classList.remove('hidden');
      } else {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        nextBtn.classList.remove('w-full');
        submitBtn.classList.add('hidden');
      }
    }

    function toggleOtherInput(checkboxId, containerId) {
      const checkbox = document.getElementById(checkboxId);
      const container = document.getElementById(containerId);
      if (checkbox.checked) {
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
