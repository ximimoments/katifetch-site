<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katifetch Feedback Survey</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Mono', monospace; }
    .cursor-blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .checkbox-item input[type="checkbox"] {
      appearance: none; width: 16px; height: 16px;
      border: 1.5px solid #4ade80; background: transparent;
      cursor: pointer; flex-shrink: 0; margin-top: 2px;
    }
    .checkbox-item input[type="checkbox"]:checked {
      background: #4ade80;
      box-shadow: inset 0 0 0 2px #0a0a0a;
    }
    .toast { transform: translateY(100px); opacity: 0; transition: all 0.3s; }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8" style="background: rgb(10, 10, 10);">
  <main class="max-w-2xl mx-auto">
    <header class="mb-8">
      <h1 class="canva-text text-2xl font-bold" style="color: rgb(74, 222, 128); font-weight: 700; font-style: normal; font-size: 30px;">$ Katifetch Beta 14 --feedback</h1>
      <p class="canva-text mt-2 opacity-70" style="color: rgb(163, 163, 163); font-weight: 400; font-style: normal; font-size: 15px;">Help improve Katifetch and his Beta version. Select all that apply.</p>
      <span class="cursor-blink text-green-400">█</span>
    </header>

    <form id="survey-form" class="space-y-8">
      <!-- Section 1: Distro/OS -->
      <section>
        <h2 class="canva-text font-bold mb-4" style="color: rgb(74, 222, 128); font-weight: 400; font-style: normal; font-size: 20px;">→ Your distro / operating system:</h2>
        <label for="distro-input" class="sr-only">Your distro or OS</label> 
        <input type="text" id="distro-input" class="canva-input w-full bg-transparent border border-green-900 rounded p-3 focus:outline-none focus:border-green-400 transition-colors" placeholder="Type your distribution or OS here..." style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">
      </section>

      <!-- Section 2: Bugs -->
      <section>
        <h2 class="canva-text font-bold mb-4" style="color: rgb(74, 222, 128); font-weight: 400; font-style: normal; font-size: 20px;">→ Bugs or issues encountered:</h2>
        <div class="space-y-3" id="bugs-group">
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="bug" value="ASCII art display or alignment problems"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">ASCII art display or alignment problems</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="bug" value="Need to make Katifetch work on rare / niche distros"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Need to make Katifetch work on rare / niche distros</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="bug" value="Incorrect hardware info detection (CPU, RAM, GPU)"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Incorrect hardware info detection (CPU, RAM, GPU)</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="bug" value="Slow execution time / startup lag"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Slow execution time / startup lag</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="bug" value="Shell compatibility issues (Fish, Zsh, Bash, etc.)"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Shell compatibility issues (Fish, Zsh, Bash, etc.)</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="bug" value="Display / resolution scaling errors in terminal"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Display / resolution scaling errors in terminal</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="bug" value="None / Works perfectly"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">None / Works perfectly</span></label>
        </div>
      </section>

      <!-- Section 3: Features -->
      <section>
        <h2 class="canva-text font-bold mb-4" style="color: rgb(74, 222, 128); font-weight: 400; font-style: normal; font-size: 20px;">→ Features &amp; improvements to add next:</h2>
        <div class="space-y-3" id="features-group">
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="feature" value="Custom ASCII art / logo picker"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Custom ASCII art / logo picker</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="feature" value="More color scheme and theme customization options"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">More color scheme and theme customization options</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="feature" value="JSON / Export output format support"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">JSON / Export output format support</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="feature" value="Standalone / static binary build options"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Standalone / static binary build options</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="feature" value="Better mobile / Termux integration"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Better mobile / Termux integration</span></label> 
          <label class="checkbox-item flex items-start gap-3 cursor-pointer"><input type="checkbox" name="feature" value="Custom config file (dotfile) support"><span class="canva-text" style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;">Custom config file (dotfile) support</span></label>
        </div>
      </section>

      <!-- Section 4: Open Feedback -->
      <section>
        <h2 class="canva-text font-bold mb-4" style="color: rgb(74, 222, 128); font-weight: 400; font-style: normal; font-size: 20px;">→ Open feedback:</h2>
        <label for="open-feedback" class="sr-only">Open feedback</label> 
        <textarea id="open-feedback" class="canva-input w-full h-32 bg-transparent border border-green-900 rounded p-3 resize-y focus:outline-none focus:border-green-400 transition-colors" placeholder="Any extra suggestions or details..." style="color: rgb(229, 229, 229); font-weight: 400; font-style: normal; font-size: 15px;"></textarea>
      </section>

      <button type="submit" class="canva-button px-6 py-3 rounded font-bold transition-opacity hover:opacity-80 disabled:opacity-40" style="background: rgb(74, 222, 128); color: rgb(10, 10, 10); font-weight: 700; font-style: normal; font-size: 15px;">Submit Feedback</button>
    </form>

    <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded shadow-lg">
      <span id="toast-msg" class="canva-text font-bold" style="background: rgb(26, 26, 26); color: rgb(74, 222, 128); font-weight: 400; font-style: normal; font-size: 15px;">✓ Feedback submitted successfully!</span>
    </div>
  </main>

  <script>
    const form = document.getElementById('survey-form');
    const submitBtn = form.querySelector('[type="submit"]');
    const toast = document.getElementById('toast');
    let submitting = false;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitting) return;
      submitting = true;
      submitBtn.disabled = true;

      const distro_os = document.getElementById('distro-input').value.trim() || 'Not specified';
      const bugs = [...form.querySelectorAll('input[name="bug"]:checked')].map(i => i.value).join('; ') || 'None';
      const features = [...form.querySelectorAll('input[name="feature"]:checked')].map(i => i.value).join('; ') || 'None';
      const open_feedback = document.getElementById('open-feedback').value.trim() || 'N/A';

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            access_key: "a04c3705-1781-40be-af37-1d211f560c2a",
            subject: "Katifetch Survey Submission",
            from_name: "Katifetch Survey",
            Distro_OS: distro_os,
            Bugs_Encountered: bugs,
            Features_Requested: features,
            Open_Feedback: open_feedback
          })
        });

        const result = await response.json();
        if (result.success) {
          form.reset();
          showToast(false);
        } else {
          showToast(true);
        }
      } catch (err) {
        showToast(true);
      }

      submitting = false;
      submitBtn.disabled = false;
    });

    function showToast(error) {
      const msg = document.getElementById('toast-msg');
      if (error) msg.textContent = '✗ Submission failed. Try again.';
      else msg.textContent = '✓ Feedback submitted successfully!';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
